name: Build unsigned IPA

# 手动触发：打开仓库页面 → Actions → 左侧 "Build unsigned IPA" → Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-15 自带 Xcode 16，能编 iOS 16 部署目标。
    # 如果哪天报 "no runner matching"，把它改成 macos-14 或 macos-latest。
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 装 JS 依赖
        run: npm ci

      - name: 生成 iOS 原生工程
        run: npx expo prebuild --platform ios --no-install --clean

      - name: 装 CocoaPods 依赖
        working-directory: ios
        run: pod install

      - name: 编译（不签名）
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace = $WS"
          echo "scheme    = $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: 打成 ipa
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          echo "app = $APP"
          test -n "$APP"
          rm -rf Payload app.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr app.ipa Payload
          ls -lh app.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-ipa
          path: app.ipa
          retention-days: 30
